#Internal version of the config. DO NOT CHANGE.
configVersion = "0.0.0"

["HUD Layout"]
	# The style of the HUD. BAR is horizontal, ICON is vertical.
	#Allowed Values: BAR, ICON
	hudStyle = "BAR"
	#X offset for the Stamina HUD in BAR mode.
	#Range: -5000 ~ 5000
	barXOffset = 0
	#Y offset for the Stamina HUD in BAR mode.
	#Range: -5000 ~ 5000
	barYOffset = 1
	#X offset for the Stamina HUD in ICON mode.
	#Range: -5000 ~ 5000
	iconXOffset = 0
	#Y offset for the Stamina HUD in ICON mode.
	#Range: -5000 ~ 5000
	iconYOffset = 0
	# Width of the bar in pixels (Used for BAR style)
	#Range: 1 ~ 1000
	barWidth = 182
	# Height of the bar in pixels (Used for BAR style)
	#Range: 1 ~ 100
	barHeight = 4
	#Regen Arrow Style: DEFAULT (uses >>> ), CUSTOM (uses your custom texture made in the sprite sheet) or OFF.
	#Allowed Values: DEFAULT, CUSTOM, OFF
	regenIndicatorStyle = "DEFAULT"
	#If true, draws a slightly dark border around the regen indicators (>).
	showRegenBorder = true
	# Whether to render text/emoji icons on the stamina bar penalty zones.
	showIcons = true
	# Draw a numerical text readout (e.g., 100 / 100) on the stamina HUD.
	showNumericalReadout = false
	#X offset for the numerical readout.
	#Range: -5000 ~ 5000
	numberXOffset = 0
	#Y offset for the numerical readout.
	#Range: -5000 ~ 5000
	numberYOffset = 0
	#Size scale for the numerical readout.
	#Range: 0.1 ~ 5.0
	numberScale = 0.6
	#Brightness multiplier for the extra stamina bar section.
	#Range: 1.0 ~ 5.0
	extraStaminaBrightness = 4.5
	#Enable the Stamina HUD overlay
	enableStaminaHUD = true

[Colors]
	#Range: 0 ~ 16777215
	colorBackground = 2236962
	#Range: 0 ~ 16777215
	colorSafe = 65280
	#Range: 0 ~ 16777215
